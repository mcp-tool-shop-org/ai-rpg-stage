name: ci

# Paths-gated: this repo is a Godot project and a workflow run costs real minutes.
# `.github/workflows/**` is included so a change to this file is tested by itself.
on:
  push:
    paths:
      - 'project.godot'
      - 'client/**'
      - 'stage/**'
      - 'tools/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'entities/**'
      - 'transitions/**'
      - 'assets/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'project.godot'
      - 'client/**'
      - 'stage/**'
      - 'tools/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'entities/**'
      - 'transitions/**'
      - 'assets/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, not floating. The stage's scene format and the studio's export lane
  # are both version-bound; "whatever is latest" is how a green suite starts
  # testing a different engine than the one the work was proven on.
  GODOT_VERSION: '4.7-stable'
  # ENGINE_REF and FORGE_REF are NOT here. They live in
  # .github/upstream-pins.env and are loaded by the first step below.
  #
  # They used to read `main`, three lines under a comment saying "Pinned, not
  # floating" -- a comment asserting a property the code did not have, which is
  # worse than no comment because it tells the next reader not to look. The
  # Export Salt Road step GENERATES stage/fixtures/world.tscn from world-forge's
  # exporter, so a floating ref meant the scene under test was not a fixed
  # artifact: this suite went red with no commit in this repo when the generated
  # scene began referencing res://scripts/player.gd and res://world_data/zones/
  # *.tres, paths this repo does not contain.
  #
  # They then moved OUT of this file because GITHUB_TOKEN cannot modify anything
  # under .github/workflows/, so the weekly bump job could not propose a change
  # while they lived here. Keeping them as data is truer anyway: they record
  # what was proven, not how to run it.
  ENGINE_REPO: 'mcp-tool-shop-org/ai-rpg-engine'

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: stage

      # The pins live in .github/upstream-pins.env, not in this file: GITHUB_TOKEN
      # cannot modify workflow files, so the weekly bump job could never propose a
      # change to them while they sat here. Loaded into the env context so the
      # checkouts below still read ${{ env.ENGINE_REF }} unchanged.
      - name: Load upstream pins
        shell: bash
        run: |
          set -euo pipefail
          grep -E "^(ENGINE_REF|FORGE_REF)=[0-9a-f]{40}$" stage/.github/upstream-pins.env >> "$GITHUB_ENV"
          grep -E "^(ENGINE_REF|FORGE_REF)=" stage/.github/upstream-pins.env

      # A SIBLING checkout, because that is exactly how the harness resolves the
      # engine locally (`AI_RPG_ENGINE_DIR`, else `../ai-rpg-engine`). CI and a
      # developer's machine therefore exercise the same resolution path — the
      # alternative is a CI-only layout that works until someone runs it by hand.
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: ai-rpg-engine

      # The live-session suite drives Salt Road, which world-forge exports. Checked out
      # and run in CI for the same reason the engine is: the proof is worthless against a
      # fixture nobody generated from the real authoring lane.
      - uses: actions/checkout@v5
        with:
          repository: mcp-tool-shop-org/world-forge
          ref: ${{ env.FORGE_REF }}
          path: world-forge

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the engine CLI
        working-directory: ai-rpg-engine
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # The harness looks for exactly this file and fails loudly without it. Asserted
          # here so a build that silently produced nothing fails at the build step
          # rather than as a confusing connection timeout later.
          test -f packages/cli/dist/bin.js || { echo "::error::engine CLI did not build"; exit 1; }
          # And that the transport the stage needs actually exists in this ref.
          #
          # ⚠ Output is captured to a file and grepped separately, NOT piped into
          # `grep -q`.
          #
          # OBSERVED, and the cause is not yet established: the piped form
          # (`node ... 2>&1 | grep -q -- '--listen'` under `set -o pipefail`) FAILED on
          # this runner against a ref that demonstrably carries the flag, while the
          # identical pipeline passes locally. So the gate declared "no --listen
          # transport" about an engine that has it — a gate failing for the wrong reason,
          # which is as useless as one that cannot fail.
          #
          # An EPIPE-under-pipefail theory was the obvious suspect and was TESTED and
          # REFUTED: node exits 0 when its pipe closes early, and `--help` returns
          # through the branch that does not call `process.exit`. What is measured is
          # that this help text goes entirely to STDERR (28 lines; stdout gets none),
          # which makes it sensitive to how a given platform flushes a piped stderr at
          # exit. Capturing to a file removes the dependency either way, and the `cat`
          # below means the next failure arrives with its own evidence instead of a
          # theory.
          node packages/cli/dist/bin.js sidecar --help > /tmp/sidecar-help.txt 2>&1 || true
          grep -q -- '--listen' /tmp/sidecar-help.txt \
            || { echo "::error::this engine ref has no --listen transport"; cat /tmp/sidecar-help.txt; exit 1; }

      - name: Export Salt Road
        working-directory: world-forge
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # ONE invocation emits BOTH lanes — the client's scene and the sim's content —
          # and refuses to write if they disagree about which zones exist. A first version
          # ran the engine lane through an inline `npx tsx -e`, where a relative import has
          # no base file to resolve against: `Cannot find module './dogfood/worlds/salt-road.js'`.
          npx tsx dogfood/export-stage-fixture.ts             --world=salt-road             --out=../stage/fixtures             --doctor             --engine-out=dogfood/output/salt-road/pack.json
          test -f dogfood/output/salt-road/pack.json || { echo "::error::engine-lane pack not written"; exit 1; }
          test -f ../stage/fixtures/world.tscn || { echo "::error::scene not written"; exit 1; }

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${ZIP}"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Report Godot version
        run: |
          set -euo pipefail
          # Captured then grepped, for the same reason as the engine-build step above:
          # this check used the same piped-into-`grep -q` shape and would have been
          # exposed to the same unexplained failure.
          ~/godot/godot --version > /tmp/godot-version.txt 2>&1
          cat /tmp/godot-version.txt
          # The Godot that runs the suite must be the one the suite was pinned to. A
          # cache key can hit on a stale entry; this is the check that the binary is
          # what the key claims.
          grep -q "^4\.7\." /tmp/godot-version.txt \
            || { echo "::error::Godot is not 4.7.x"; exit 1; }

      # Import populates the .godot/ cache — texture imports and the global class
      # cache. Without it, the first real run does the work AND reports the noise
      # as scene-load failures.
      - name: Import project
        working-directory: stage
        run: ~/godot/godot --headless --path . --import

      - name: Headless suite
        working-directory: stage
        run: |
          set -euo pipefail
          # AI_RPG_ENGINE_DIR is deliberately NOT set: the harness falls back to a
          # sibling `../ai-rpg-engine`, which is the layout above, so CI exercises the
          # same resolution a developer does instead of a CI-only shortcut.
          ~/godot/godot --headless --path . --script res://tools/headless.gd 2>&1 | tee /tmp/suite.log
          # The runner's own exit code is authoritative, but `tee` hides it behind
          # the pipe, so the verdict line is checked directly. Belt and braces on
          # purpose: a suite whose failure cannot reach the CI status is not a gate.
          grep -q '^verdict=PASS' /tmp/suite.log \
            || { echo "::error::headless suite reported failure"; exit 1; }

      - name: Every expected suite actually ran
        run: |
          set -euo pipefail
          # The runner discovers `tests/test_*.gd` by glob, so a file that is renamed,
          # deleted, or moved simply stops being found and the suite passes with fewer
          # checks and no complaint. This is the manifest that makes a disappearance a
          # failure. Adding a suite here is deliberate; that is the point.
          for suite in diorama framing live_session scene_join tick_queue wire_session; do
            grep -q "^── ${suite} ──$" /tmp/suite.log \
              || { echo "::error::suite '${suite}' did not run"; exit 1; }
          done
          echo "all six suites ran"

      - name: Refuse resource-load noise
        run: |
          set -euo pipefail
          # A scene that half-loads still instantiates, and a join test will
          # happily reconcile the surviving half. Godot reports the damage on
          # stderr rather than through an exit code, so it is asserted here.
          if grep -Eq 'SCRIPT ERROR|Failed loading resource|Cannot open file|Condition ".*" is true' /tmp/suite.log; then
            echo "::error::engine reported load errors during the suite"
            grep -En 'SCRIPT ERROR|Failed loading resource|Cannot open file|Condition ".*" is true' /tmp/suite.log
            exit 1
          fi

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-suite-log
          path: /tmp/suite.log
          retention-days: 7
